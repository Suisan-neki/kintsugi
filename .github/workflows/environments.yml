name: Pinned target environments
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  MUGIURUSHI_SOURCE_REVISION: ${{ github.sha }}
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target: [ohif-build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.99-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.99-${{ hashFiles('Cargo.lock') }}-
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo build --locked
      - run: python3 tools/environment-runner-tests.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Build or infer, distinguish failures and retain dependency evidence
        run: node tools/environment-smoke.mjs ${{ matrix.target }}
      - run: npm ci --ignore-scripts
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install-deps chromium
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Observe OHIF list and images, reject image requests and retry
        if: matrix.target == 'ohif-build'
        run: node tools/ohif-smoke.mjs
      - name: Keep synthetic environment records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: environment-${{ matrix.target }}
          path: |
            evaluations/ci-environments/**/*.json
            evaluations/ci-environments/**/*.log
            evaluations/ci-environments/**/*.npy
            evaluations/ci-ohif/**/*.json
            evaluations/ci-ohif/**/*.png
            evaluations/ci-ohif/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save compiled Cargo dependencies even when a check fails
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
