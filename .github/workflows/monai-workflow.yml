name: MONAI synthetic workflow
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  MUGIURUSHI_SOURCE_REVISION: ${{ github.sha }}
jobs:
  monai:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.99-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.99-${{ hashFiles('Cargo.lock') }}-
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo build --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Prepare pinned CPU dependencies and verify the original inference example
        run: node tools/environment-smoke.mjs monai-cpu
      - name: Train, save, reload, read back, fail at four stages and retry
        run: node tools/monai-workflow-smoke.mjs
      - name: Keep synthetic workflow and case evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monai-workflow
          path: |
            evaluations/ci-monai-workflow/**/*.json
            evaluations/ci-monai-workflow/**/*.log
            evaluations/ci-monai-workflow/**/*.npy
            evaluations/ci-monai-workflow/**/*.pt
          if-no-files-found: ignore
          retention-days: 7
