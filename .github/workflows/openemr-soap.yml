name: OpenEMR synthetic SOAP workflow
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  MUGIURUSHI_SOURCE_REVISION: ${{ github.sha }}
jobs:
  soap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.99-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.99-${{ hashFiles('Cargo.lock') }}-
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo build --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install-deps chromium
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Enable the OS sandbox for pinned Chromium
        run: bash .github/scripts/chromium-sandbox.sh
      - name: Save and reload four SOAP fields, stop the DB and retry
        run: |
          umask 077
          printf '%s' '{"username":"eel-operator","password":"eel-pass-trial"}' > "$RUNNER_TEMP/openemr-secrets.json"
          EEL_BROWSER_SECRETS_FILE="$RUNNER_TEMP/openemr-secrets.json" node tools/openemr-soap-smoke.mjs
      - name: Select a versioned SOAP recipe and execute it through the browser UI
        run: npm run test:browser-handoff -- --live
      - name: Keep synthetic SOAP workflow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openemr-soap
          path: |
            evaluations/ci-openemr-soap/**/*.json
            evaluations/ci-openemr-soap/**/*.png
            evaluations/ci-openemr-soap/**/*.log
            test-results/browser-handoff-*.png
            test-results/browser-handoff-live.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Save compiled Cargo dependencies even when a check fails
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  manual-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check independent local trial environments and reject changed configuration
        run: python3 tools/openemr-trial-tests.py
      - name: Start two pinned OpenEMR instances, confirm login forms and remove trial resources
        run: python3 tools/openemr-trial-smoke.py
      - name: Keep environment status without credentials or Compose settings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openemr-manual-trial
          path: |
            evaluations/openemr-manual-trial/ready.json
            evaluations/openemr-manual-trial/trial.json
            evaluations/openemr-manual-trial/boundaries.json
          if-no-files-found: ignore
          retention-days: 7
