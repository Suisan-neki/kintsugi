name: Rust checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Verify the pinned yomiyasu rules and upstream checker
        run: python3 tools/check-yomiyasu.py
      - name: Check version-bound OpenEMR trial plan requests
        run: node --test tools/openemr-trial-plan-tests.mjs
      - run: node tools/queue-demo.mjs evaluations/ci-queue
      - run: node tools/pinned-demo.mjs evaluations/ci-external
      - run: node tools/backend-demo.mjs evaluations/ci-backend --live
      - run: npm run test:reader-native
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:journey
      - run: npm run test:dialogue
      - run: npm run test:user-trial
      - name: Operate the app against the public repository sjl/t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf '%s' "$GH_TOKEN" > "$RUNNER_TEMP/github-token"
          EEL_GITHUB_TOKEN_FILE="$RUNNER_TEMP/github-token" npm run test:reader-native -- --live
          EEL_GITHUB_TOKEN_FILE="$RUNNER_TEMP/github-token" npm run test:app
      - name: Send and store a DICOM image with pinned pynetdicom and pydicom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf '%s' "$GH_TOKEN" > "$RUNNER_TEMP/github-token"
          EEL_GITHUB_TOKEN_FILE="$RUNNER_TEMP/github-token" npm run test:dicom
      - run: npm run test:browser
      - run: cargo test --locked --test containers browser_observes_nginx -- --ignored --nocapture
      - name: Register a synthetic OpenEMR patient and visit, then repeat with the database stopped
        run: |
          umask 077
          printf '%s' '{"username":"eel-operator","password":"eel-pass-trial"}' > "$RUNNER_TEMP/openemr-secrets.json"
          EEL_BROWSER_SECRETS_FILE="$RUNNER_TEMP/openemr-secrets.json" cargo test --locked --test containers openemr_browser -- --ignored --nocapture
      - name: Keep synthetic review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-review-screenshots
          path: |
            test-results/*.png
            evaluations/ci-openemr/**/*.json
            evaluations/ci-openemr/**/*.png
            evaluations/ci-external/result.json
            evaluations/ci-backend/result.json
            evaluations/ci-backend/analysis.json
            evaluations/ci-queue/result.json
            evaluations/ci-queue/review.json
            evaluations/ci-queue/review.html
            evaluations/ci-queue/understanding.json
          if-no-files-found: ignore
          retention-days: 7
