name: Rust checks
on:
  pull_request:
    paths: &code_paths
      - 'src/**'
      - 'ui/**'
      - 'adapters/**'
      - 'tests/**'
      - 'tools/**'
      - 'examples/**'
      - 'third_party/**'
      - 'Cargo.*'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.github/**'
  push:
    branches: [main]
    paths: *code_paths
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  MUGIURUSHI_SOURCE_REVISION: ${{ github.sha }}
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - run: cargo fmt --check
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.99-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.99-
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-binary
          path: target/debug/mugiurushi
          retention-days: 1
      - name: Save compiled Cargo dependencies even when a check fails
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
  e2e:
    if: github.event_name != 'push'
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: test-binary
          path: target/debug
      - run: chmod +x target/debug/mugiurushi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:api
      - name: Verify the pinned yomiyasu rules and upstream checker
        run: python3 tools/check-yomiyasu.py
      - run: node --test tools/openemr-trial-plan-tests.mjs
      - run: python3 tools/environment-runner-tests.py
      - run: python3 tools/openemr-trial-tests.py
      - run: node tools/queue-demo.mjs evaluations/ci-queue
      - run: node tools/pinned-demo.mjs evaluations/ci-external
      - run: node tools/backend-demo.mjs evaluations/ci-backend
      - run: npm run test:reader-native
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install-deps chromium
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Enable the OS sandbox for pinned Chromium
        run: bash .github/scripts/chromium-sandbox.sh
      - run: npm run test:browser
      - run: npm run test:journey
      - run: npm run test:dialogue
      - run: npm run test:browser-handoff
      - run: npm run test:user-trial
      - name: Keep synthetic review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-review-screenshots
          path: |
            test-results/*.png
            evaluations/ci-*/**/*.json
          if-no-files-found: ignore
          retention-days: 7
