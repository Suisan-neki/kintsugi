[package]
name = "mugiurushi"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
cap-std = "=4.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

regex = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
url = "2"
sha2 = "0.10.9"
serde_yaml_ng = "=0.10.0"
